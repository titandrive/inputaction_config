# InputActions configuration, managed by Actuator.
# Actuator rewrites this file in this layout every time it saves.

# Button names, apps, folders and devices used by Actuator. Safe to edit.
# actuator:button back = Back
# actuator:button forward = Forward
# actuator:button leftmeta+w = Side Button
# actuator:button leftshift+leftmeta+leftbrace = Left Wheel
# actuator:button leftshift+leftmeta+rightbrace = Right Wheel
# actuator:button middle = Middle
# actuator:app Project Zomboid
# actuator:app RimWorld
# actuator:app org.kde.dolphin
# actuator:folder Games = factorio, RimWorld, Project Zomboid
# actuator:folder Productivity = firefox, org.kde.dolphin
# actuator:foldericon Games = gamepad-2
# actuator:foldericon Productivity = laptop

# Actuator's options (Options → Store Preferences in Config). Safe to edit.
# actuator:pref keep_versions = 10
# actuator:pref tabs = Mouse, Keyboard, Touchpad, Touchscreen
# actuator:pref developer_mode = on
# actuator:pref developer_options = yaml_editor, only_if, store_prefs, git_autocommit
# actuator:pref git_push = on
# actuator:pref git_readme = on

# ============================================================================
# MOUSE
# ============================================================================
mouse:
  gestures:

  # Factorio
  # --------------------------------------------------------------------------
  # Forward
  # Note: Open/Close inventory
  - id: factorio_mouse_forward_e
    type: press
    mouse_buttons: [forward]
    instant: true
    conditions:
    - $window_class matches (?i)factorio
    actions:
    - 'on': begin
      input:
      - keyboard: [e]

  # Back
  # Note: Pick up item
  - id: factorio_mouse_back_f
    type: press
    mouse_buttons: [back]
    instant: true
    conditions:
    - $window_class matches (?i)factorio
    actions:
    - 'on': begin
      input:
      - keyboard: [+f]
    - 'on': end_cancel
      input:
      - keyboard: [-f]

  # Middle
  - id: factorio_middle
    type: press
    mouse_buttons: [middle]
    instant: true
    conditions:
    - $window_class == factorio
    actions:
    - 'on': begin
      input:
      - keyboard: [e]

# ============================================================================
# KEYBOARD (includes mouse buttons that send shortcuts)
# ============================================================================
keyboard:
  gestures:

  # Factorio
  # --------------------------------------------------------------------------
  # Side Button
  # Note: Pipette Tool / Clear Selection
  - id: factorio_mouse_q
    type: shortcut
    shortcut: [leftmeta, w]
    clear_modifiers: true
    conditions:
    - $window_class matches (?i)factorio
    actions:
    - 'on': begin
      input:
      - keyboard: [q]

  # Left Wheel
  # Note: Rotate item CCW
  - id: factorio_mouse_rotate_left
    type: shortcut
    shortcut: [leftshift, leftmeta, leftbrace]
    clear_modifiers: true
    conditions:
    - $window_class matches (?i)factorio
    actions:
    - 'on': begin
      input:
      - keyboard: [leftshift+r]

  # Right Wheel
  # Note: Rotate item CW
  - id: factorio_mouse_rotate_right
    type: shortcut
    shortcut: [leftshift, leftmeta, rightbrace]
    clear_modifiers: true
    conditions:
    - $window_class matches (?i)factorio
    actions:
    - 'on': begin
      input:
      - keyboard: [r]

  # Firefox
  # --------------------------------------------------------------------------
  # Left Wheel
  # Note: Previous Tab
  - id: firefox_mouse_tabs_left
    type: shortcut
    shortcut: [leftshift, leftmeta, leftbrace]
    clear_modifiers: true
    conditions:
    - $window_class == firefox
    actions:
    - 'on': begin
      input:
      - keyboard: [leftctrl+pageup]

  # Right Wheel
  # Note: Next Tab
  - id: firefox_mouse_tabs_right
    type: shortcut
    shortcut: [leftshift, leftmeta, rightbrace]
    clear_modifiers: true
    conditions:
    - $window_class == firefox
    actions:
    - 'on': begin
      input:
      - keyboard: [leftctrl+pagedown]

  # Side Button
  # Note: Close Tab
  - id: firefox_mouse_close_tab
    type: shortcut
    shortcut: [leftmeta, w]
    clear_modifiers: true
    conditions:
    - $window_class == firefox
    actions:
    - 'on': begin
      input:
      - keyboard: [leftctrl+w]

# ============================================================================
# TOUCHPAD
# ============================================================================
touchpad:
  gestures:

  # Global
  # --------------------------------------------------------------------------
  - id: global_window_switcher
    type: swipe
    fingers: 3
    direction: left_right
    block_events: true
    actions:
    - 'on': begin
      input:
      - keyboard: [+leftalt, tab]
    - 'on': update
      interval: -75
      input:
      - keyboard: [leftshift+tab]
    - 'on': update
      interval: 75
      input:
      - keyboard: [tab]
    - 'on': end_cancel
      input:
      - keyboard: [-leftalt]

  # Firefox
  # --------------------------------------------------------------------------
  # Note: Next Tab
  - id: firefox_tabs_up
    type: swipe
    fingers: 3
    direction: up
    conditions:
    - $window_class == firefox
    actions:
    - 'on': begin
      input:
      - keyboard: [leftctrl+leftshift+tab]

  # Note: Previous Tab
  - id: firefox_tabs_down
    type: swipe
    fingers: 3
    direction: down
    conditions:
    - $window_class == firefox
    actions:
    - 'on': begin
      input:
      - keyboard: [leftctrl+tab]

  # Note: Close tab
  - id: firefox_close_tab_click_5
    type: click
    fingers: 5
    conditions:
    - $window_class == firefox
    actions:
    - 'on': end
      input:
      - keyboard: [leftctrl+w]

# ============================================================================
# TOUCHSCREEN
# ============================================================================
touchscreen:
  gestures:

  # Firefox
  # --------------------------------------------------------------------------
  - id: firefox_touchscreen_swipe
    type: swipe
    fingers: 3
    direction: up
    conditions:
    - $window_class == firefox
    actions:
    - 'on': begin
      input:
      - keyboard: [leftctrl+tab]

# ============================================================================
# DEVICE SETTINGS
# ============================================================================
device_rules:
- conditions: $touchpad
  swipe:
    angle_tolerance: 45
